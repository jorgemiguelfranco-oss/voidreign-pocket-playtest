name: Deploy VOIDREIGN Pocket Empire
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone/**"
      - ".github/workflows/deploy-pocket-empire.yml"
permissions:
  contents: read
concurrency:
  group: pocket-empire-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package offline-first phone game
        uses: actions/upload-pages-artifact@v3
        with:
          path: phone
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned browser automation package
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Verify live HTTPS install manifest, Android icons, gameplay and offline reload
        env:
          VOIDREIGN_BASE_URL: https://jorgemiguelfranco-oss.github.io/voidreign-pocket-playtest/
        run: node phone/browser-test.cjs
