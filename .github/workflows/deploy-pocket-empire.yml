name: Deploy VOIDREIGN Pocket Empire
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone/**"
      - ".github/workflows/deploy-pocket-empire.yml"
permissions:
  contents: read
concurrency:
  group: pocket-empire-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package offline-first phone game
        uses: actions/upload-pages-artifact@v3
        with:
          path: phone
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
